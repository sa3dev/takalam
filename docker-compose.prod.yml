version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: takalam-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-takalam}
      POSTGRES_USER: ${POSTGRES_USER:-takalam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-takalam_user} -d ${POSTGRES_DB:-takalam}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  redis:
    image: redis:7-alpine
    container_name: takalam-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: takalam-backend
    restart: unless-stopped
    # expose, pas ports : derrière Dokploy c'est Traefik qui route via le réseau
    # Docker. Publier 8000 sur l'hôte rendrait l'API joignable en clair sur
    # http://IP_DU_VPS:8000, court-circuitant le TLS.
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-takalam_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-takalam}
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ENVIRONMENT: production
      DEBUG: "False"
      # Comma-separated list of allowed frontend origins
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://takalamapp.com,https://www.takalamapp.com}
      # Nombre de proxies qui ajoutent leur maillon à X-Forwarded-For avant
      # d'atteindre l'API. À vérifier après le premier déploiement : une valeur
      # trop basse fait voir la même IP pour tout le monde, et les limites de
      # débit deviennent globales. Procédure de contrôle dans DEPLOYMENT.md.
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-2}
      # Quota freemium et prix affichés — déplaçables sans redéploiement
      FREE_DAILY_SPOKEN_SECONDS: ${FREE_DAILY_SPOKEN_SECONDS:-600}
      PRO_PRICE_MONTHLY_EUR: ${PRO_PRICE_MONTHLY_EUR:-12.99}
      PRO_PRICE_ANNUAL_EUR: ${PRO_PRICE_ANNUAL_EUR:-129.0}
      DAILY_SPOKEN_SECONDS_ALERT: ${DAILY_SPOKEN_SECONDS_ALERT:-36000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # curl n'est pas installé dans python:3.11-slim : l'ancien healthcheck curl
    # échouait toujours, le backend restait "unhealthy" et le frontend, qui
    # l'attend, ne démarrait jamais. urllib fait partie de la bibliothèque
    # standard, donc rien à installer.
    # 127.0.0.1 et non localhost : dans un conteneur, localhost résout d'abord
    # vers ::1, alors qu'uvicorn n'écoute que sur 0.0.0.0 (IPv4). urllib essaie
    # les adresses l'une après l'autre et s'en sortait, mais la même écriture a
    # rendu le frontend "unhealthy" en production — autant ne pas dépendre d'une
    # différence de comportement entre deux clients HTTP.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Single worker — ConnectionManager is in-memory, multiple workers would split WS state
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      # En build args, pas seulement en environnement : next.config.js est lu
      # par `next build`, et ses rewrites/headers/env finissent gravés dans
      # l'image. Fournies uniquement au conteneur, ces valeurs seraient ignorées
      # et le site se construirait sur des défauts localhost. Changer le domaine
      # impose donc de reconstruire l'image, pas seulement de redémarrer.
      args:
        INTERNAL_API_URL: http://backend:8000
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_DOMAIN: ${NEXT_PUBLIC_DOMAIN}
    container_name: takalam-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        condition: service_healthy
    # wget vient de busybox, présent dans node:20-alpine — contrairement à curl.
    # 127.0.0.1 et non localhost : localhost résout d'abord vers ::1, le serveur
    # Next n'écoute que sur 0.0.0.0 (PORT/HOSTNAME du Dockerfile), et le wget de
    # busybox ne réessaie pas en IPv4 après un refus. Le healthcheck échouait
    # donc toujours, Traefik écarte les conteneurs non sains, et le domaine
    # restait sans routeur : le site répondait 404 alors que l'application
    # tournait très bien.
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

volumes:
  postgres_data:
  redis_data:
